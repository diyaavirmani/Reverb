services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - ./n8n/.env
    environment:
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_INTERNAL_SECRET: ${N8N_INTERNAL_SECRET}
      N8N_STORAGE_WEBHOOK_URL: ${N8N_STORAGE_WEBHOOK_URL}
      APP_URL: ${APP_URL}
      N8N_CHECK_PROCESSED_EVENT_URL: ${N8N_CHECK_PROCESSED_EVENT_URL}
      N8N_AUDIT_EVENT_URL: ${N8N_AUDIT_EVENT_URL}
      N8N_CONVERSATION_STATE_URL: ${N8N_CONVERSATION_STATE_URL}
      N8N_PAYMENT_LOCK_URL: ${N8N_PAYMENT_LOCK_URL}
      N8N_DISCOVERY_WEBHOOK_URL: ${N8N_DISCOVERY_WEBHOOK_URL}
      N8N_CREATIVE_WEBHOOK_URL: ${N8N_CREATIVE_WEBHOOK_URL}
      N8N_TRANSACTION_WEBHOOK_URL: ${N8N_TRANSACTION_WEBHOOK_URL}
      N8N_ACTIVATION_WEBHOOK_URL: ${N8N_ACTIVATION_WEBHOOK_URL}
      N8N_REPORT_WEBHOOK_URL: ${N8N_REPORT_WEBHOOK_URL}
      N8N_MAX_PRAVA_POLLS: ${N8N_MAX_PRAVA_POLLS:-5}
      REVERB_FILL_SHEET_ID: ${REVERB_FILL_SHEET_ID}
      N8N_PROCESSED_EVENTS_TABLE_ID: ${N8N_PROCESSED_EVENTS_TABLE_ID}
      N8N_PAYMENT_LOCKS_TABLE_ID: ${N8N_PAYMENT_LOCKS_TABLE_ID}
      N8N_CONVERSATION_STATE_TABLE_ID: ${N8N_CONVERSATION_STATE_TABLE_ID}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_SQLITE_POOL_SIZE: 2
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
